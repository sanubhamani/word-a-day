<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Word a Day</title>
<meta name="description" content="One new word every day, with what it means and how to use it.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word a Day">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Noto+Nastaliq+Urdu:wght@400;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column, like a single dictionary entry on an index card, with today's word under a highlighter stroke. */
:root {
  --bg: #EDF0F4;
  --card: #FFFFFF;
  --ink: #1B2433;
  --muted: #5A6578;
  --line: #D6DCE5;
  --accent: #2B4C7E;
  --mark: rgba(242, 190, 34, .55);
  --good: #2E7D4F;
  --bad: #B3402E;
  --display: "Gloock", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161D; --card: #1A2029; --ink: #E8ECF2; --muted: #9AA6B8; --line: #2C3442;
    --accent: #9DBBEA; --mark: rgba(214, 160, 20, .45); --good: #6CC593; --bad: #EE8A78;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { font-family: var(--body); font-size: 1.06rem; line-height: 1.55; padding: 0 16px; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 30rem; margin: 0 auto; padding-block: 24px 40px; display: grid; gap: 18px; }

header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.date { font-family: var(--mono); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.level { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); }
.level button { font: inherit; font-size: .88rem; border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.level button[aria-pressed="true"] { background: var(--accent); color: var(--card); font-weight: 700; }

.entry { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px 22px; display: grid; gap: 14px; }
.word { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 12vw, 3.6rem); line-height: 1.05; margin: 0; overflow-wrap: anywhere; }
.urdu .word { font-family: "Noto Nastaliq Urdu", "Geeza Pro", serif; line-height: 2.1; font-size: clamp(2.2rem, 11vw, 3.2rem); }
.urdu .word span { background: linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 85%, transparent 85%); }
.urdu .say .pron { font-size: 1.05rem; color: var(--ink); }
.word span { background: linear-gradient(transparent 55%, var(--mark) 55%, var(--mark) 92%, transparent 92%); padding: 0 .06em; }
.say { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); }
.say .pron { font-family: var(--mono); font-size: .92rem; }
.say .pos { font-style: italic; }
.speak { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: transparent; color: var(--accent); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.label { font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.meaning { font-size: 1.22rem; margin: 0; }
.use { margin: 0; font-style: italic; border-left: 3px solid var(--mark); padding-left: 12px; }
.hook { background: var(--bg); border-radius: 10px; padding: 12px 14px; }
.hook p:last-child { margin: 0; font-weight: 700; }
.from { margin: 0; font-size: .92rem; color: var(--muted); }
.count { margin: 0; font-family: var(--mono); font-size: .75rem; color: var(--muted); letter-spacing: .04em; }

.did { font: inherit; font-weight: 700; font-size: 1.05rem; width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--accent); color: var(--card); cursor: pointer; }
.did[disabled] { background: transparent; color: var(--good); border: 1px solid var(--good); cursor: default; }
.streak { text-align: center; color: var(--muted); font-size: .95rem; margin: -6px 0 0; }

.quiz { display: grid; gap: 10px; }
.quiz h2 { font-family: var(--display); font-weight: 400; font-size: 1.45rem; margin: 0; }
.quiz p { margin: 0; color: var(--muted); }
.choice { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.choice.right { border-color: var(--good); color: var(--good); font-weight: 700; }
.choice.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.result { font-weight: 700; min-height: 1.5em; }

.peek { display: flex; justify-content: center; align-items: center; gap: 14px; color: var(--muted); font-size: .9rem; }
.peek button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; width: 40px; height: 40px; cursor: pointer; }
.home { font-size: .88rem; color: var(--muted); text-align: center; margin: 0; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .entry { animation: rise .35s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="date"></div>
    <div class="level" role="group" aria-label="Word level">
      <button id="lvl-kids" type="button" aria-pressed="false">Kids</button>
      <button id="lvl-adults" type="button" aria-pressed="true">Grown-ups</button>
      <button id="lvl-urdu" type="button" aria-pressed="false">Urdu</button>
    </div>
  </header>

  <article class="entry" aria-live="polite">
    <h1 class="word"><span id="word" dir="auto"></span></h1>
    <div class="say">
      <span class="pron" id="pron"></span>
      <span class="pos" id="pos"></span>
      <button class="speak" id="speak" type="button">Hear it</button>
    </div>
    <div>
      <p class="label">What it means</p>
      <p class="meaning" id="meaning"></p>
    </div>
    <div class="hook" id="hookbox">
      <p class="label">Remember it</p>
      <p id="hook"></p>
    </div>
    <div>
      <p class="label">Use it</p>
      <p class="use" id="use"></p>
    </div>
    <p class="from" id="from"></p>
    <p class="count" id="count"></p>
  </article>

  <button class="did" id="did" type="button">I used it today</button>
  <p class="streak" id="streak"></p>

  <section class="quiz" aria-labelledby="qhead">
    <h2 id="qhead">Remember yesterday?</h2>
    <p id="qask-1"></p>
    <div class="quiz" id="choices-1"></div>
    <div class="result" id="result-1" role="status"></div>
  </section>

  <section class="quiz" aria-labelledby="qhead7">
    <h2 id="qhead7">Remember last week?</h2>
    <p id="qask-7"></p>
    <div class="quiz" id="choices-7"></div>
    <div class="result" id="result-7" role="status"></div>
  </section>

  <div class="peek">
    <button id="prev" type="button" aria-label="Previous day">&#8249;</button>
    <span id="peeklabel">Today</span>
    <button id="next" type="button" aria-label="Next day">&#8250;</button>
  </div>
  <p class="home" id="home">On iPhone: open in Safari, tap Share, then “Add to Home Screen.”</p>
</div>

<script src="words.js"></script>
<script>
// Day 1 is 8 October 2026. Kids and Grown-ups hold 1,825 words each: five years with no repeats. Urdu holds one year.
const START = Date.UTC(2026, 9, 8) / 86400000;
const WORDS = window.WORDS;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let level = store.get("wad-level", "adults");
if (!WORDS[level]) level = "adults";
let offset = 0;
const $ = id => document.getElementById(id);

function dayNumber(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function dateFor(off) { const d = new Date(); d.setDate(d.getDate() + off); return d; }
function indexFor(off) { const n = WORDS[level].length; return (((dayNumber(dateFor(off)) - START) % n) + n) % n; }
function wordFor(off) { return WORDS[level][indexFor(off)]; }

function render() {
  const d = dateFor(offset);
  const [w, pron, pos, mean, use, from] = wordFor(offset);
  $("date").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  $("word").textContent = w;
  $("pron").textContent = pron;
  $("pos").textContent = pos;
  $("meaning").textContent = mean;
  $("use").textContent = use;
  const hook = wordFor(offset)[6];
  $("hook").textContent = hook || "";
  $("hookbox").hidden = !hook;
  $("from").textContent = from ? "Where it comes from: " + from : "";
  $("from").hidden = !from;
  $("count").textContent = "Word " + (indexFor(offset) + 1).toLocaleString() + " of " + WORDS[level].length.toLocaleString();
  $("peeklabel").textContent = offset === 0 ? "Today" : (offset > 0 ? "+" : "") + offset + (Math.abs(offset) === 1 ? " day" : " days");
  $("lvl-kids").setAttribute("aria-pressed", level === "kids");
  $("lvl-adults").setAttribute("aria-pressed", level === "adults");
  $("lvl-urdu").setAttribute("aria-pressed", level === "urdu");
  document.body.classList.toggle("urdu", level === "urdu");
  $("word").lang = level === "urdu" ? "ur" : "en";
  renderUsed();
  renderQuiz();
}

function renderUsed() {
  const used = store.get("wad-used", []);
  const has = off => used.includes(level + ":" + dayNumber(dateFor(off)));
  const done = has(offset);
  $("did").disabled = done;
  $("did").textContent = done ? "Used it. Nice work." : "I used it today";
  let streak = 0;
  for (let i = done ? offset : offset - 1; has(i) && streak < 2000; i--) streak++;
  $("streak").textContent = streak ? streak + (streak === 1 ? " day" : " days") + " in a row" : "Use the word once today, out loud or in a text.";
}

// Seeing a word again a day later and a week later is what makes it stick.
function renderQuiz() { quiz(1); quiz(7); }

function quiz(back) {
  const entry = wordFor(offset - back);
  const [w, , , mean] = entry;
  const hook = entry[6];
  $("qask-" + back).textContent = "What does “" + w + "”" + (level === "urdu" ? " (" + entry[1].replace(/-/g, "").toLowerCase() + ")" : "") + " mean?";
  const list = WORDS[level];
  const n = list.length;
  const seed = dayNumber(dateFor(offset)) + back * 13;
  // Wrong answers never come from today's word or the last week, so the quiz can't give one away.
  const skip = new Set();
  for (let d = 0; d <= 7; d++) skip.add(indexFor(offset - d));
  const opts = [mean];
  for (let k = 0; opts.length < 3 && k < 50; k++) {
    const i = (seed * 37 + k * 211) % n;
    if (!skip.has(i) && !opts.includes(list[i][3])) opts.push(list[i][3]);
  }
  const pos = seed % 3;
  [opts[0], opts[pos]] = [opts[pos], opts[0]];
  const box = $("choices-" + back), result = $("result-" + back);
  box.innerHTML = "";
  result.textContent = "";
  opts.forEach((o, i) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "choice"; btn.id = "choice-" + back + "-" + i; btn.textContent = o;
    btn.addEventListener("click", () => {
      [...box.children].forEach(c => { c.disabled = true; if (c.textContent === mean) c.classList.add("right"); });
      if (o === mean) { result.textContent = "Yes! You remembered."; result.style.color = "var(--good)"; }
      else { btn.classList.add("wrong"); result.textContent = "Not quite. " + (hook || "Now you know it."); result.style.color = "var(--bad)"; }
    });
    box.appendChild(btn);
  });
}

$("did").addEventListener("click", () => {
  const used = store.get("wad-used", []);
  used.push(level + ":" + dayNumber(dateFor(offset)));
  store.set("wad-used", used);
  renderUsed();
});
$("speak").addEventListener("click", () => {
  try {
    const [w, pron, , mean] = wordFor(offset);
    let u;
    if (level === "urdu") {
      // Use an Urdu voice when the phone has one; otherwise read the English spelling.
      const v = speechSynthesis.getVoices().find(x => /^ur/i.test(x.lang));
      u = new SpeechSynthesisUtterance(v ? w : pron.replace(/-/g, " "));
      if (v) { u.voice = v; u.lang = v.lang; }
    } else {
      u = new SpeechSynthesisUtterance(w + ". " + mean);
    }
    u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { $("speak").textContent = "Sound not available"; }
});
$("lvl-kids").addEventListener("click", () => { level = "kids"; store.set("wad-level", level); render(); });
$("lvl-adults").addEventListener("click", () => { level = "adults"; store.set("wad-level", level); render(); });
$("lvl-urdu").addEventListener("click", () => { level = "urdu"; store.set("wad-level", level); render(); });
$("prev").addEventListener("click", () => { offset--; render(); });
$("next").addEventListener("click", () => { offset++; render(); });

// Opened from the home screen: hide the install tip. Come back to the app on a new day: show the new word.
if (window.navigator.standalone || matchMedia("(display-mode: standalone)").matches) $("home").hidden = true;
let shownDay = dayNumber(new Date());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && dayNumber(new Date()) !== shownDay) { shownDay = dayNumber(new Date()); offset = 0; render(); }
});

render();
</script>
</body>
</html>
